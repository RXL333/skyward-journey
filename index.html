<canvas tabindex="0" aria-label="飞行场景"></canvas><header><div class="mark">〰</div><div><h1>云上漫游</h1><small>GUILIN · LI RIVER</small></div></header>
<button id="view" aria-pressed="false" title="切换第一人称座舱视角（V）">座舱视角 · V</button><button id="toggle" aria-expanded="false" aria-controls="panel">☷　飞行调校</button><aside hidden id="panel"><h2>飞行调校</h2><div id="fields"></div><footer><button id="defaults">恢复默认</button><button id="export">导出 JSON</button></footer></aside>
